[project]
name = "streetide"
version = "0.1.0"
description = "Watch a city flood with walking time — real streets, not a circle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "networkx>=3.2",
    "osmnx>=2.0.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
streetide = "streetide.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streetide"]

[tool.hatch.build]
include = [
    "streetide/**",
    "README.md",
    "LICENSE",
]
